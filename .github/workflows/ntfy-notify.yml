name: ntfy Notify
on:
  workflow_dispatch:
    inputs:
      title:
        required: true
        default: "AI新闻日报"
      message:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to ntfy.sh
        run: |
          curl -s \
            -H "Title: ${{ inputs.title }}" \
            -H "Tags: newspaper,robot" \
            -H "Priority: default" \
            -d "${{ inputs.message }}" \
            https://ntfy.sh/my-ai-news
